# Render Blueprint — one-click deploy of the SmartRecruit API + frontend.
# In Render: New > Blueprint > select this repo. Set DATABASE_URL (and
# optionally JWT_SECRET) when prompted, then deploy.
services:
  - type: web
    name: smartrecruit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon/PostgreSQL connection string at deploy time
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
